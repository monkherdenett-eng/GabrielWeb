<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бүртгэл амжилттай | Gabriel Wavecounter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #161a1e; color: #fff; font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#1e2329] rounded-2xl border border-gray-700 shadow-2xl p-8 max-w-md w-full text-center">
        <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Төлбөр амжилттай!</h1>
        <p class="text-gray-400 mb-6">Таны бүртгэл баталгаажлаа. Бид тантай удахгүй холбогдох болно.</p>
        {% if name %}
        <div class="bg-[#161a1e] rounded-lg p-4 border border-gray-700 text-left mb-6">
            <p class="text-sm text-gray-400">Нэр: <span class="text-white font-semibold">{{ name }}</span></p>
            {% if phone %}
            <p class="text-sm text-gray-400 mt-1">Утас: <span class="text-white font-semibold">{{ phone }}</span></p>
            {% endif %}
        </div>
        {% endif %}
        <a href="/" class="block w-full bg-[#007AFF] hover:bg-[#005bb5] text-white font-bold py-3 rounded-md transition-all">
            Нүүр хуудас руу буцах
        </a>
    </div>
</body>
</html>
